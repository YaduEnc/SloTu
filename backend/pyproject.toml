[project]
name = "slotu-backend"
version = "0.1.0"
description = "FastAPI backend for SLOTU"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.13.3",
  "asyncpg==0.30.0",
  "bcrypt==4.0.1",
  "boto3==1.35.66",
  "celery==5.4.0",
  "cryptography==43.0.3",
  "email-validator==2.2.0",
  "fastapi==0.115.5",
  "flower==2.0.1",
  "httpx==0.28.1",
  "passlib[bcrypt]==1.7.4",
  "psycopg2-binary==2.9.10",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.17",
  "PyJWT==2.10.1",
  "redis==5.2.0",
  "sentry-sdk[fastapi]==2.18.0",
  "slowapi==0.1.9",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "flake8==7.1.1",
  "isort==5.13.2",
  "mypy==1.13.0",
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
